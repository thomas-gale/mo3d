[project]
name = "mo3d"
version = "0.1.0"
description = "Prototype 3d library for Mojo Lang"
authors = ["Thomas Gale <mail@thomasjamesgale.com>"]
channels = ["conda-forge", "https://conda.modular.com/max-nightly"]
readme = "README.md"
license = "Apache-2.0"
platforms = ["linux-64", "osx-arm64"]

[tasks]
start = { cmd = "mojo run src/main.mojo", depends-on = ["setup"] }
package = { cmd = "mkdir -p bin && magic run mojo package src/mo3d -o bin/mo3d.mojopkg && cp bin/mo3d.mojopkg test/mo3d/mo3d.mojopkg", depends-on = ["setup"], inputs=["src/**/*.mojo"], outputs = ["bin/mo3d.mojopkg", "test/mo3d/mo3d.mojopkg"] }
test = { cmd = "magic run mojo test ./test", depends-on = ["package"], inputs=["src/**/*.mojo", "test/**/*.mojo"] }
build = { cmd = "mkdir -p bin && magic run mojo build src/main.mojo -o bin/mo3d", depends-on = ["setup", "build-setup"], inputs=["src/**/*.mojo"], outputs = ["bin/mo3d"] }
built = { cmd = "bin/mo3d", depends-on = ["build"] }
perf = { cmd = "perf record -F 99 --call-graph dwarf bin/mo3d", depends-on = ["build"]  }

[dependencies]
max = ">=25.1.0.dev2025020805,<26"
pillow = ">=10.4.0,<11"

[target.linux-64.tasks]
setup = { cmd="echo 'Please ensure you have llvm sdl2 installed'", inputs=["pixi.toml"] }
build-setup = { cmd="echo 'Please ensure you have build-essential, python3 and pillow installed'", inputs=["pixi.toml"] }

[target.osx-arm64.tasks]
setup = { cmd="echo 'Please ensure you have llvm sdl2 installed'", inputs=["pixi.toml"] }
build-setup = { cmd="echo 'Please ensure you have python@3 and pillow installed'", inputs=["pixi.toml"] }
