[workspace]
name = "mo3d"
version = "0.1.0"
description = "Prototype 3d library for Mojo Lang"
authors = ["Thomas Gale <mail@thomasjamesgale.com>"]
channels = ["conda-forge", "https://conda.modular.com/max-nightly"]
readme = "README.md"
license = "Apache-2.0"
platforms = ["linux-64", "osx-arm64"]

[tasks]
format = { cmd = "mojo format ./src && mojo format ./test" }
start = { cmd = "mojo run src/main.mojo" }
package = { cmd = "mkdir -p bin && mojo package src/mo3d -o bin/mo3d.mojopkg && cp bin/mo3d.mojopkg test/mo3d/mo3d.mojopkg", inputs=["src/**/*.mojo"], outputs = ["bin/mo3d.mojopkg", "test/mo3d/mo3d.mojopkg"] }
test = { cmd = "mojo test ./test", depends-on = ["package"], inputs=["src/**/*.mojo", "test/**/*.mojo"] }
build = { cmd = "mkdir -p bin && mojo build src/main.mojo -o bin/mo3d -Xlinker -ldl", inputs=["src/**/*.mojo"], outputs = ["bin/mo3d"] }
built = { cmd = "bin/mo3d", depends-on = ["build"] }
perf = { cmd = "perf record -F 99 --call-graph dwarf bin/mo3d", depends-on = ["build"]  }

[dependencies]
mojo = "<1.0.0" # includes `mojo-compiler`, lsp, debugger, formatter etc.
max = "*"
pillow = "*"
sdl2 = "*"
